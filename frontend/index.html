<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>多人实时协作文档</title>
    <!--
      配色变量内联在 head：Vite 的业务 CSS 由 JS 注入，加载前页面无底色，
      透明画布会闪黑（冷缓存首刷最明显）。阻塞式样式 + html 背景规则
      保证首帧即有正确底色；变量唯一来源也是这里（main.css 不再重复定义）。
      深色模式：data-theme="dark" 由下方内联脚本在首帧前写入（localStorage
      → 跟随系统），应用侧 useDark 使用同一 storageKey，两侧逻辑必须同步。
    -->
    <style>
      :root {
        color-scheme: light;
        --bg-page: #f6f7f9;
        --bg-surface: #ffffff;
        --bg-muted: #f2f3f5;
        --border-subtle: #e5e6eb;
        --border-faint: #eef0f3;
        /* 分层阴影：贴近纸面的接触阴影 + 稍远的悬浮阴影，避免一刀切的灰蒙 */
        --shadow-card: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
        --shadow-float: 0 8px 24px rgba(16, 24, 40, 0.12), 0 2px 6px rgba(16, 24, 40, 0.08);
        --shadow-lift: 0 12px 28px rgba(16, 24, 40, 0.14), 0 3px 8px rgba(16, 24, 40, 0.08);
        /* 圆角尺度：小控件 / 常规卡片 / 大面板 */
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        /* 语义变量（与 styles/theme.ts 的 Naive token 对齐） */
        --text-1: #1f2329;
        --text-2: #4e5969;
        --text-3: #6a707a;
        --bg-hover: #f2f3f5;
        --bg-active: #e5e6eb;
        --border-strong: #d0d3d9;
        --bg-editor: #ffffff; /* 文档纸面/表格底色 */
        /* 文档类型识别色：MD=蓝 / Excel=绿，图标底、徽标、类型标记共用 */
        --type-md: #2080f0;
        --type-md-bg: #e8f1fe;
        --type-excel: #18a058;
        --type-excel-bg: #e6f6ec;
        /* 状态色对（徽标、diff、横幅：底 + 字成对换） */
        --status-ok-bg: #e8f7ee;
        --status-ok-fg: #1a7f37;
        --status-err-bg: #fdeceb;
        --status-err-fg: #b42318;
        --status-warn-bg: #fff7e6;
        --status-warn-fg: #ad6800;
        --status-warn-border: #ffe7ba;
        --status-info-bg: #e7f1ff;
        --status-info-fg: #1d5fbf;
        --search-hit-bg: rgba(255, 212, 0, 0.45);
        --col-active-bg: #eaf3ff;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg-page: #141519;
        --bg-surface: #1c1e23;
        --bg-muted: #25272d;
        --border-subtle: #2b2e35;
        --border-faint: #23252b;
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
        --shadow-float: 0 8px 24px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
        --shadow-lift: 0 12px 28px rgba(0, 0, 0, 0.6), 0 3px 8px rgba(0, 0, 0, 0.45);
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;
        --text-1: #e9eaee;
        --text-2: #a9aeb8;
        --text-3: #86909c;
        --bg-hover: #25272d;
        --bg-active: #2e3138;
        --border-strong: #3a3e46;
        --bg-editor: #1c1e23;
        --type-md: #4098fc;
        --type-md-bg: rgba(32, 128, 240, 0.16);
        --type-excel: #36ad6a;
        --type-excel-bg: rgba(24, 160, 88, 0.16);
        --status-ok-bg: #12301f;
        --status-ok-fg: #57d38c;
        --status-err-bg: #3a1518;
        --status-err-fg: #f97066;
        --status-warn-bg: #33240a;
        --status-warn-fg: #f5c065;
        --status-warn-border: #5a4218;
        --status-info-bg: #12243f;
        --status-info-fg: #7eb0ff;
        /* 深色下降低不透明度，避免亮黄压过继承的浅色文字 */
        --search-hit-bg: rgba(255, 212, 0, 0.28);
        --col-active-bg: rgba(32, 128, 240, 0.25);
      }
      html,
      body {
        background: var(--bg-page);
      }
    </style>
    <script>
      /* 首帧前定主题：localStorage 优先（与 useTheme 的 storageKey 同步），否则跟随系统 */
      (function () {
        try {
          var t = localStorage.getItem('collab-doc-theme')
          if (t !== 'dark' && t !== 'light') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          document.documentElement.setAttribute('data-theme', t)
        } catch (e) {
          /* 隐私模式等异常场景回退浅色 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
