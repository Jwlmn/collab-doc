# collab-doc 生产 Nginx：
# - 静态：前端构建产物（SPA fallback → index.html）
# - PHP：/api、/sanctum、/up 及一切交给 Laravel 的路由 → php-fpm（app:9000）
# - WebSocket：/collab → HocusPocus（collab:1234）
#
# SCRIPT_FILENAME 固定为 /var/www/html/public/index.php ——
# 与 backend 容器内 Laravel public 路径一致（fastcgi 由 fpm 侧解析文件）。

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.html;

    client_max_body_size 20m;

    # --- 协作 WebSocket（前缀最长优先，先于 location / 匹配）---
    location /collab {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Laravel API / Sanctum / 健康检查 ---
    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass app:9000;
    }

    # --- 其余 .php（保守兜底，同样交给 fpm）---
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_pass app:9000;
    }

    # --- 前端静态（SPA fallback）---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
